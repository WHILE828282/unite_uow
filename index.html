<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Unite: join official UOWD clubs, discover verified student events, and get tickets in seconds." />
    <meta property="og:title" content="Unite · UOWD clubs & events" />
    <meta property="og:description" content="Join clubs in one tap, discover verified student events and host your own." />
    <meta property="og:url" content="https://uniteuow.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://uniteuow.com/icons/icon-1024.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <!-- Paint the theme background before anything loads, so a reload never flashes white. -->
    <style>html { background: #eeebe6; } html.u-boot-dark { background: #0e0f13; color-scheme: dark; }
      .u-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; animation: uBoot .3s ease .15s forwards; }
      .u-boot img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45); }
      @keyframes uBoot { to { opacity: 1; } }</style>
    <script>try { if (localStorage.getItem("unite-theme") === "dark") document.documentElement.classList.add("u-boot-dark"); } catch (e) {}</script>
    <title>Unite · UOWD clubs & events</title>
  </head>
  <body>
    <div id="root"><div class="u-boot" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /></div></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
